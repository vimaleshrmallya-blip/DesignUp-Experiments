<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DesignUp 2026 Island</title><style>html,body,#root{height:100%;margin:0}</style></head><body><!--
  HOW TO ADD OR DELETE LINKEDIN POSTS (no coding needed)
  Edit the JSON list in the <script id="du-posts"> block below.
  - ADD:    copy one {...} entry, paste it after a comma, change the fields.
  - DELETE: remove that whole {...} entry (and one comma so the list stays valid).
  Fields:
    id        any unique text, e.g. "p7"
    type      "summary"  = recap of the event / a day / several talks -> shown in the centre circle
              "talk"     = about one talk -> shown on that talk's card
    day       "oct3" | "oct4" | "all"   (for summaries)
    talks     talk ids the post is about, e.g. ["d1-03"]   (ids: d1-01..d1-13 = Sat 3, d2-01..d2-10 = Sun 4; use [] for event-wide)
    author, role, excerpt   the name, a short line, and the lines the author approved
    linkedin, portfolio, url   profile / portfolio / post links (leave "" if none)
    embed     optional. On the LinkedIn post: ... menu > "Embed this post", copy the address inside src="..." (it starts with
              https://www.linkedin.com/embed/). The real post then shows inside the centre panel when that summary is selected. Leave "" if none.
    seed      any text; it makes the author's abstract avatar (same seed = same avatar)
    consent   where/when they said yes, e.g. "DM 12 Oct". Empty shows a SAMPLE tag.
  Only add posts with the author's permission. Check the JSON is valid (a missing comma breaks the list and the page falls back to the sample posts).
-->

/* Layout concept: one floating-island map fills the frame; chrome floats on top as cream cards (toolbar, legend, detail, scrubber, rotate). Single calm look by choice. */
.isl{--mline:#ee8fc0;--gridc:rgba(255,255,255,.18);--land:#fdf0dc;--edge:#c93a87;--pill:#fffaf0;--sky1:#f1effc;--sky2:#d9ecfa;--mapbg:#e6ecfb;--rim:#fff;--btn:#f7e3a8;--bg:#f3effb;--card:#fcefc9;--ink:#17112b;--mute:#6a5c9c;--line:#ecd9a0;--chip:#f7e3a8;--mag:#c93a87;--ind:#5b4b9a;
 --fri:#4f86e8;--sat:#f4620a;--sun:#9b6fe0;
 --sans:'Outfit',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,Menlo,monospace;--serif:'Instrument Serif',Georgia,serif}
.isl *{box-sizing:border-box}
.isl{height:100%;min-height:100vh;width:100%;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans);overflow:hidden}
.page{height:100vh;padding:24px 32px}
.map>svg.bgsvg{pointer-events:none}
.thumbs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.thumbs .th{pointer-events:auto;cursor:pointer;position:relative;transition:opacity .2s,transform .2s}
.trow:has(.th:hover){animation-play-state:paused}
.thumbs .th:hover{opacity:1!important;animation-play-state:paused;transform:translateY(-4px) scale(1.07);z-index:3}
.thumbs .th:hover .sq{box-shadow:0 0 0 2px var(--mag),0 10px 24px -8px rgba(0,0,0,.6)}
.th .tip{display:none;position:absolute;left:0;top:100%;margin-top:18px;width:170px;background:var(--card);color:var(--ink);border-radius:8px;padding:7px 9px;font:11px/1.35 var(--sans);box-shadow:0 8px 22px -8px rgba(0,0,0,.6);white-space:normal;z-index:4}
.th:hover .tip{display:block}
.trow:nth-child(n+4) .tip{top:auto;bottom:100%;margin:0 0 8px}
.map>svg:not(.bgsvg){pointer-events:none}.map>svg:not(.bgsvg) *{pointer-events:auto}
.trow{position:absolute;left:0;display:flex;gap:46px;width:max-content;animation:tdrift linear infinite}
.trow.rev{animation-direction:reverse}
@keyframes tdrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.th{width:76px;flex:none;animation:tfade 9s ease-in-out infinite}
@keyframes tfade{0%,100%{opacity:.1}50%{opacity:.55}}
.th .sq{position:relative;width:76px;height:76px;border-radius:4px;overflow:hidden;background:var(--chip)}
.th .sq svg{display:block}
.th .thmb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;pointer-events:none}
